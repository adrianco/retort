# Experiment 60 — does "Terra clears every language" survive the factual gate?
#
# exp-56's headline is 'Terra clears every remaining language, both tasks' at
# requirement_coverage 1.00. Those runs PREDATE the factual gate, so their
# factual_accuracy is NULL and they pass it by construction. exp-58 showed the
# gap is real: sol 0.92 checklist -> 0.83 with facts; luna 0.83 -> 0.33. Terra is
# the missing middle, and it is the model exp-56's conclusion is about.
#
# n=1 DELIBERATELY: this re-measures exp-56's own cells with one gate added, so
# the comparison is cell-by-cell against a known result rather than a new
# pass-proportion. Every factor is exp-56's except the gate.
#
# A NULL WOULD BE THE STRONGEST DEFENCE of the whole pre-gate corpus, and is
# worth publishing for that reason alone.
#
# Also re-measures exp-56's objc/brazil cell, which fails the MECHANICAL gate.
# That is not a Terra capability wall -- exp-46 scored objc 1.00 on this task
# with Opus 5 -- and the harness has had several launch fixes since.
experiment:
  name: experiment-60-terra-facts-brazil
  visibility: public
# The factor registry requires >= 2 levels per factor; design.csv pins the one
# actually run. Only `language` genuinely varies.
factors:
  language: { levels: [typescript, rust, java, clojure, erlang, elixir, csharp, c, cpp, swift, objc] }
  agent: { levels: [codex, claude-code] }          # design pins codex
  prompt: { levels: [neutral, none] }              # design pins neutral
  model: { levels: [gpt-5.6-terra, gpt-5.6-sol] } # design pins terra
  effort: { levels: [default, medium] }            # design pins default
# factual_accuracy GATES (see docs/future-experiments.md §0); runtime is
# measurement only. BOTH run live for the first time here — runtime has only
# ever been invoked over archives via `retort rebuild`, and its numbers here are
# contended by the agent on the same box, so they are comparable WITHIN this
# experiment only.
responses: [code_quality, token_efficiency, test_coverage, defect_rate,
            maintainability, idiomatic, factual_accuracy, runtime]
tasks:
  - source: github://brazil-bench/benchmark-template/brazilian-soccer-mcp-guide.md
playpen:
  runner: local
  replicates: 1
  timeout_minutes: 150
  stall_minutes: 30
  max_turns: 200
  prompts_dir: prompts
  local_agents:
    codex: { harness: codex, model: gpt-5.6-terra }
design: { screening_resolution: 3, significance_threshold: 0.10 }
promotion: { screening_to_trial: { p_value: 0.10 }, trial_to_production: { posterior_confidence: 0.80 } }
evaluation: { enabled: true, model: opus-4.8 }
