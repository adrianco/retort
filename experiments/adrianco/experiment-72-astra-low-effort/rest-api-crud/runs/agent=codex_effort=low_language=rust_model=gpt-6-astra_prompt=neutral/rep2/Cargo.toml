[package]
name = "book-collection"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

[lib]
path = "lib.rs"

[[bin]]
name = "book-collection"
path = "main.rs"

[[test]]
name = "api"
path = "tests.rs"
