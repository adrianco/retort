[package]
name = "brazilian-soccer-mcp"
version = "0.1.0"
edition = "2021"
description = "A stdio MCP server for querying Brazilian soccer datasets"
license = "MIT"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
strip = true
