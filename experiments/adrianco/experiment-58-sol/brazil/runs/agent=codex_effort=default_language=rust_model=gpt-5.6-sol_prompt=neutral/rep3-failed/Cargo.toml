[package]
name = "brasileirao-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server for querying Brazilian soccer datasets"
license = "MIT"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "brasileirao-mcp"
path = "src/main.rs"
