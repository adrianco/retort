[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brazilian-soccer-mcp"
version = "1.0.0"
description = "Offline MCP knowledge graph for bundled Brazilian soccer datasets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.28.1,<2",
  "pydantic>=2.12,<3",
]

[project.scripts]
brazilian-soccer-mcp = "server:main"

[tool.setuptools]
py-modules = ["main", "server", "soccer_knowledge_graph"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "-q"
