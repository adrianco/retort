[project]
name = "books-api"
version = "1.0.0"
description = "REST API for managing a book collection (Python standard library: WSGI + SQLite)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
