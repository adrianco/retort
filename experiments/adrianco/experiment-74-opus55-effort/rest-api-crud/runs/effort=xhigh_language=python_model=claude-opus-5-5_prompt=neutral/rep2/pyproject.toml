[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "books-api"
version = "1.0.0"
description = "A REST API for managing a book collection, backed by SQLite (standard library only)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
books-api = "books_api.server:main"

[tool.setuptools]
packages = ["books_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
