# Experiment 85 — GPT-6.1 Sol across the effort ladder (routine task), via Codex, ISOLATED.
#
# WHY. GPT-6.1 Sol (2026-09-29) supersedes the unmeasured GPT-6 Sol: same $2/$10 as Sonnet 5.5, but
# cached input $0.10 (half GPT-6 Sol's) — and cache reads dominate agentic runs. Vendor claims
# near-Astra agentic coding at a fifth of Astra's price. Same ladder and cells as exp-77 (Sonnet 5.5)
# so the matched-price comparison is cell for cell.
#
# EFFORT: low/medium/high/xhigh/max + `default`. `none` is NOT supported on 6.1 Sol. `default` is in
# the design as a CHECK of the 2026-09-30 CODEX_HOME fix: isolated, it must behave like `medium` (the
# model's documented default), not like the owner's config.toml value.
#
# EXPECTATION, recorded before the run: coverage 1.00 everywhere (frontier tier); cost per run at low
# below Sonnet 5.5's isolated $0.10-0.12; `default` indistinguishable from `medium`.
#
# PRICING: added to retort/pricing.py 2026-10-17 from OpenAI's model page ($2 / $0.10 / $10, cache
# write $2.50). NOT modelled: >272K-token prompts bill 2x/1.5x — check per-request prompt size.
experiment:
  name: experiment-85-sol61-effort-smoke
  visibility: public
factors:
  effort: { levels: [low, medium, high, xhigh, max, default] }
  language: { levels: [python, go] }
  agent: { levels: [codex, claude-code] }
  prompt: { levels: [neutral, none] }
  model: { levels: [gpt-6.1-sol, gpt-6-sol] }
responses: [code_quality, token_efficiency, test_coverage, defect_rate, maintainability, idiomatic]
tasks:
  - source: bundled://rest-api-crud
playpen:
  runner: local
  replicates: 1
  timeout_minutes: 90   # exp-77's go/max needed >90 once; headroom only
  stall_minutes: 25
  max_turns: 200
  prompts_dir: prompts
  local_agents:
    codex: { harness: codex, model: gpt-6.1-sol }
design: { screening_resolution: 3, significance_threshold: 0.10 }
promotion: { screening_to_trial: { p_value: 0.10 }, trial_to_production: { posterior_confidence: 0.80 } }
evaluation: { enabled: true, model: opus-4.8 }
