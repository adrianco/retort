[package]
name = "book-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.6", features = ["runtime-tokio-rustls", "sqlite", "macros"] }
tokio = { version = "1.0", features = ["full"] }
tower = { version = "1.0", features = ["util"] }
http = "1.0"
uuid = { version = "1.0", features = ["v4"] }