[package]
name = "book-api-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.0"
sqlite = "0.2"
serde = { version = "1.0", features = "derive" }
serde_json = "1.0"
anyhow = "1.0"

[dev-dependencies]
tokio = { version = "1.0", features = "full" }
tokio-test = "0.4"
actix-web-test = "0.5"