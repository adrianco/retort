# experiment-81-codex56-isolated — ISOLATED RE-RUN of experiment-58-sol/brazil. NEW directory; the original is untouched.
#
# Covers exp-58 (Sol). CAVEAT: effort=`default` in exp-58 ran at the owner's config.toml
# model_reasoning_effort (medium today; unrecorded then), NOT Sol's own default (low). Isolated,
# `default` now means Sol's real default — so a difference here mixes isolation with low-vs-medium. Those agents opened with the ruvnet-brain plugin announcing itself and made
# ~240 ruvnet-brain/ruflo MCP calls across exp-57..60.
#
# ONLY CHANGE: the agent under test no longer inherits the host owner's config.
# Claude: --strict-mcp-config, empty --mcp-config, --setting-sources project,local
# (1e6c8437). Codex: a fresh per-run CODEX_HOME holding only auth.json (c09d7f95).
# Everything else — task, design, n, timeouts, judge, gates, prompts — is copied
# from experiment-58-sol/brazil/workspace.yaml below. In master.db the original rows carry
# agent_context=mcp-enabled; these carry mcp-cleared.
#
# ---- original workspace.yaml follows (its own comments kept for context) ----
# Experiment 58 — gpt-5.6-sol, the new frontier Codex model.
#
# NEW MODEL, first priority. models_cache.json (refreshed 2026-08-12) lists
# gpt-5.6-sol — "Latest frontier agentic coding model" — alongside terra
# ("balanced, everyday") and luna ("fast and affordable"). master.db has luna
# and terra; sol has never been run. Per incremental-experiments, ONLY the new
# model runs here.
#
# EFFORT = sol's OWN DEFAULT, WHICH IS `low` — terra's default is `medium`.
# "Default effort" is therefore NOT the same setting across these models, and a
# sol-vs-terra comparison at "default" compares low against medium unless one is
# pinned. This runs sol at the setting a user actually gets, and records that.
#
# A NEW EFFORT LEVEL EXISTS: `ultra`, above `max`. exp-55 swept low..max and
# never saw it; sol/terra/luna all advertise it. Queued as a separate gap.
#
# LANGUAGES: python and go have the most comparison data; rust and typescript
# are where models have historically separated.
#
# factual_accuracy GATES here. exp-57 found 5 of 6 luna cells at
# requirement_coverage 1.00 with three shipping a demonstrably wrong 2019 table,
# so the frontier comparison is the interesting one: does more capability mean
# correct answers, or a more convincing wrong one?
#
# COMPARABILITY: pass/fail now includes the factual gate, so these
# pass-proportions are not strictly comparable with the 284 pre-gate brazil
# runs. requirement_coverage is unaffected and still pools.
#
# JUDGE held at opus-4.8, unchanged since exp-53.
experiment:
  name: experiment-81-codex56-isolated-brazil-58
  visibility: public
# The factor registry requires >= 2 levels per factor; design.csv pins the one
# actually run. Only `language` genuinely varies.
factors:
  language: { levels: [python, go, rust, typescript] }
  agent: { levels: [codex, claude-code] }          # design pins codex
  prompt: { levels: [neutral, none] }              # design pins neutral
  model: { levels: [gpt-5.6-sol, gpt-5.6-terra] } # design pins sol
  effort: { levels: [default, medium] }            # design pins default
# factual_accuracy GATES (see docs/future-experiments.md §0); runtime is
# measurement only. BOTH run live for the first time here — runtime has only
# ever been invoked over archives via `retort rebuild`, and its numbers here are
# contended by the agent on the same box, so they are comparable WITHIN this
# experiment only.
responses: [code_quality, token_efficiency, test_coverage, defect_rate,
            maintainability, idiomatic, factual_accuracy, runtime]
tasks:
  - source: github://brazil-bench/benchmark-template/brazilian-soccer-mcp-guide.md
playpen:
  runner: local
  replicates: 3
  timeout_minutes: 150
  stall_minutes: 30
  max_turns: 200
  prompts_dir: prompts
  local_agents:
    codex: { harness: codex, model: gpt-5.6-sol }
design: { screening_resolution: 3, significance_threshold: 0.10 }
promotion: { screening_to_trial: { p_value: 0.10 }, trial_to_production: { posterior_confidence: 0.80 } }
evaluation: { enabled: true, model: opus-4.8 }
