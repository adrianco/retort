[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "brazilian-soccer-mcp"
version = "0.1.0"
description = "MCP server for Brazilian soccer datasets"
requires-python = ">=3.10"
dependencies = ["mcp>=1.0"]

[project.scripts]
brazilian-soccer-mcp = "soccer_mcp:main"

[tool.pytest.ini_options]
testpaths = ["test_soccer_mcp.py"]
