[project]
name = "bookapi"
version = "1.0.0"
description = "REST API for managing a book collection (Flask + SQLite)."
requires-python = ">=3.9"
dependencies = ["Flask>=2.3"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bookapi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
