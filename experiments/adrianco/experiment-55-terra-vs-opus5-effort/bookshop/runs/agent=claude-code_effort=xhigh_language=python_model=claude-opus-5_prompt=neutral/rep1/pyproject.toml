[project]
name = "book-collection-api"
version = "1.0.0"
description = "REST API for managing a book collection (Flask + SQLite)"
requires-python = ">=3.9"
dependencies = ["Flask>=2.3,<4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make the `bookapi` package importable when running bare `pytest`.
pythonpath = ["."]
addopts = "-q"
