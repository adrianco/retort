[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brazilian-soccer-mcp"
version = "1.0.0"
description = "MCP server exposing a knowledge graph of Brazilian soccer matches, teams and players"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=1.2", "anyio>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
brazilian-soccer-mcp = "brazilian_soccer.server:main"
brazilian-soccer = "brazilian_soccer.cli:main"

[tool.setuptools]
packages = ["brazilian_soccer"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "performance: asserts the specification's response time budgets",
]
