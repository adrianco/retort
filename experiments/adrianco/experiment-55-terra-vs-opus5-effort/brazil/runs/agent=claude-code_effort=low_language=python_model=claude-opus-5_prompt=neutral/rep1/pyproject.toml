[project]
name = "brazilian-soccer-mcp"
version = "1.0.0"
description = "MCP server exposing a knowledge graph over Brazilian soccer datasets"
requires-python = ">=3.10"
dependencies = ["mcp>=2.0"]

[project.scripts]
brazilian-soccer-mcp = "brazilian_soccer.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["brazilian_soccer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
