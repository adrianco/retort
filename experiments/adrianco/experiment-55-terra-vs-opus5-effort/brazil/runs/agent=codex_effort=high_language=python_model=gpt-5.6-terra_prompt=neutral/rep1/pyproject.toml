[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brazilian-soccer-mcp"
version = "1.0.0"
description = "A dependency-free MCP server for supplied Brazilian soccer datasets"
requires-python = ">=3.10"

[project.scripts]
brazilian-soccer-mcp = "brazilian_soccer_mcp:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
