[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "brazilian-soccer-mcp"
version = "1.0.0"
description = "Dependency-free MCP server for bundled Brazilian soccer data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
brazilian-soccer-mcp = "server:main"

[tool.setuptools]
py-modules = ["server", "soccer_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
