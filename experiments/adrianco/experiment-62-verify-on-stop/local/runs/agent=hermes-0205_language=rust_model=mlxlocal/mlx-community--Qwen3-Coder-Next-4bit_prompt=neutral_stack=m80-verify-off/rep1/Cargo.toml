[package]
name = "book-api"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite"] }
tokio = { version = "1", features = ["full"] }
validator = { version = "0.18", features = ["derive"] }
thiserror = "1"
env_logger = "0.11"
log = "0.4"
serde_urlencoded = "0.7.1"

[dev-dependencies]
actix-test = "0.1"
actix-service = "1"
