[package]
name = "book_api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
tower = "0.5"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"

[dev-dependencies]
axum-test = "15"
