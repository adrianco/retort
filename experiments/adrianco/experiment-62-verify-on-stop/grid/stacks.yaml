serving:
  omlx_bin: /Applications/oMLX.app/Contents/MacOS/omlx-cli
  # hermes is not on PATH on this host (dedicated venv) — point at it explicitly,
  # or every hermes cell crashes at 0.0s "Agent CLI not found" (exp-43).
  #
  # exp-61 measures Hermes 0.20.5, so this points at the git checkout's venv
  # rather than the 0.18.2 standalone venv every prior local experiment pinned.
  # The agent profile also carries `bin:` explicitly (see workspace.yaml): the
  # profile value is what makes the VERSION a level of the agent factor, and
  # this serving value is the fallback if a profile omits it.
  hermes_bin: /Users/adriancockcroft/code/hermes-agent/.venv/bin/hermes
  model_dir: /Users/adriancockcroft/models
  host: 127.0.0.1
  port: 8080
  settings_path: /Users/adriancockcroft/.omlx/settings.json
  hermes_config: /Users/adriancockcroft/.hermes/config.yaml
  serve_flags:
  # The 80B (Qwen3-Coder-Next-4bit) measures 43.85 GB. oMLX's `balanced` tier put
  # the ceiling at ~42.6 GB on this host and refused to load it —
  #   507: Model (43.85GB) does not fit under the memory ceiling (42.66GB)
  # — so all three m80 cells produced no files and the no-write guard correctly
  # aborted the run rather than recording false zeros. The ceiling is computed
  # against FREE system memory, which is why earlier 80B experiments (exp-38/39)
  # loaded fine under `balanced` and this one did not: same flag, different
  # machine state. An explicit ceiling removes that dependence on what else
  # happens to be running.
  # NOTE this is a serving-layer memory gate only — it decides whether the model
  # LOADS, not how it generates — so it does not make these runs incomparable
  # with the earlier 80B numbers.
  #
  # 46 GB was still too low: the model loads (43.85 GB) but the enforcer projects
  # ~51.6 GB once the KV cache for a 262144-token context is accounted for, so it
  # evicted mid-generation and then refused to reload —
  #   507: projected memory 51.58GB would exceed the memory ceiling 46.00GB
  # 54 leaves room for that projection while staying under the kernel's Metal
  # wired cap (iogpu.wired_limit_mb = 57344 MB ≈ 56 GB); going above the cap makes
  # Metal panic rather than degrade.
  #
  # Why exp-38/39 ran the same model under plain `--memory-guard balanced`: that
  # ceiling (~42.7 GB) is *below* the model's own 43.85 GB, so those runs cannot
  # have passed through this enforcer at all — it arrived (or tightened) in
  # oMLX 0.5.0rc1. Treat the serving-layer version as a stack variable.
  - --memory-guard-gb
  - "54"
  # The two presets live in DIFFERENT places: m35 in model_dir
  # (~/models/Qwen3.6-35B-A3B), m80 only in the HF cache
  # (~/.cache/huggingface/hub/models--mlx-community--Qwen3-Coder-Next-4bit).
  # Verified from `omlx-cli serve --help`: --hf-cache is ADDITIVE and enabled by
  # DEFAULT ("Discover models from the standard HuggingFace Hub local cache"), so a
  # single serving block reaches both and no per-preset serve_flags are needed.
  # Stated explicitly here so a future --no-hf-cache elsewhere can't silently make
  # m80 unresolvable. (This is also why exp-38 served the 80B with no such flag.)
  - --hf-cache
  - --paged-ssd-cache-dir
  - /Users/adriancockcroft/.cache/omlx-ssd-exp49
  - --paged-ssd-cache-max-size
  - 20GB
  log: /private/tmp/claude-501/-Users-adriancockcroft-code/1985cb31-023e-4e0c-808f-49285393ada8/scratchpad/omlx-exp49.log
  warm_timeout_s: 600
presets:
  # Canonical featured settings per model. temperature/top_p/top_k differ BETWEEN the
  # two models because each was tuned separately (exp-27/28 sampling work) — this is
  # deliberate: exp-49 compares each stack AS FEATURED, not under a forced-common
  # sampling config that neither is actually recommended at.
  m35:
    model: Qwen3.6-35B-A3B
    context_length: 262144
    context_threshold: 0.9   # full-context compaction point (featured)
    sampling:
      temperature: 0.6
      top_p: 0.95
      top_k: 20
      repetition_penalty: 1.0
  m80:
    model: mlx-community--Qwen3-Coder-Next-4bit
    context_length: 262144
    context_threshold: 0.9   # the featured full-context point (exp-38/39)
    sampling:
      temperature: 0.7
      top_p: 0.95
      top_k: 40
      repetition_penalty: 1.0

  m35-verify-off:
    model: Qwen3.6-35B-A3B
    context_length: 262144
    context_threshold: 0.9   # full-context compaction point (featured)
    sampling:
      temperature: 0.6
      top_p: 0.95
      top_k: 20
      repetition_penalty: 1.0
    hermes:
      agent:
        verify_on_stop: false

  m35-verify-on:
    model: Qwen3.6-35B-A3B
    context_length: 262144
    context_threshold: 0.9   # full-context compaction point (featured)
    sampling:
      temperature: 0.6
      top_p: 0.95
      top_k: 20
      repetition_penalty: 1.0
    hermes:
      agent:
        verify_on_stop: true

  m80-verify-off:
    model: mlx-community--Qwen3-Coder-Next-4bit
    context_length: 262144
    context_threshold: 0.9   # the featured full-context point (exp-38/39)
    sampling:
      temperature: 0.7
      top_p: 0.95
      top_k: 40
      repetition_penalty: 1.0
    hermes:
      agent:
        verify_on_stop: false

  m80-verify-on:
    model: mlx-community--Qwen3-Coder-Next-4bit
    context_length: 262144
    context_threshold: 0.9   # the featured full-context point (exp-38/39)
    sampling:
      temperature: 0.7
      top_p: 0.95
      top_k: 40
      repetition_penalty: 1.0
    hermes:
      agent:
        verify_on_stop: true
