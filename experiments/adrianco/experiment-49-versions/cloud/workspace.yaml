# Experiment 49 (cloud half) — instrumented version comparison on ONE cell.
#
# versions-blog.md establishes that newer Claude versions cost ~6x and take ~4x
# longer for an IDENTICAL passing app, and that the driver is TURNS (not per-turn
# speed), with cost growing ~n^2 because every turn re-reads the whole conversation
# from cache. That rests on turns/tokens/seconds/cost, which are recorded throughout.
#
# What it CANNOT answer: the tool-call MIX per version. Older runs (exp-6) predate
# _agent_stdout.log capture, so the Write/Edit/Read/Bash histogram exists for exactly
# one run (Opus 5). This experiment re-runs every version WITH transcript capture so
# the histogram is comparable across versions.
#
# HYPOTHESIS: the extra turns in newer models are disproportionately Edit + Bash
# (verify/refine cycles) rather than initial Writes -- i.e. newer models iterate on
# their own output more. If it holds, it explains the routine-task overhead AND
# plausibly the hard-task breadth Opus 5 uniquely has.
#
# SECOND QUESTION (from versions-blog): fast mode showed 11.3 turns vs standard 4.8's
# 17.3 -- the same weights taking a third FEWER agentic steps. At n=3 vs n=6 that may
# be variance. Here both run at n=3 in the same batch, which settles it.
#
# THIRD QUESTION -- and a CONFOUND in versions-blog. Every result this project has
# published ran at the CLI's DEFAULT thinking level, never recorded as a factor. If
# newer versions simply think more by default, then "newer models take more turns"
# is partly "newer models think more" -- a different claim with a different remedy
# (turn the knob down) than "the model was tuned to iterate more".
#
# SMOKE TEST (CLAUDE.md: verify the parameter takes effect, don't just set it).
# Run 2026-07-25 before this design was written:
#   * All four versions ACCEPT --effort low|medium|high|max.
#   * It demonstrably TAKES EFFECT: with --output-format stream-json the response
#     carries a `thinking` content block at max and none at low, on 4.7/4.8/5 alike;
#     model output tokens rise with the level (Fable 5 342 -> 3499, ~10x; 4.8
#     453 -> 1417). An early weaker probe on a trivial arithmetic prompt showed 4.7
#     flat across levels and briefly looked like a silently-ignored parameter -- it
#     was too weak a probe, NOT an ignored flag. Recorded so it isn't re-litigated.
#   * DEFAULT IS NOT A NAMED LEVEL. On a fixed prompt the default landed near high
#     for 4.8 (688 vs 672 out-tok) and between medium and high for Fable 5 / Opus 5,
#     while 4.7's default emitted a thinking block though its own low/medium/high
#     did not. So `default` is carried as its own level rather than folded into one.
# Caveat: that probe is single-shot, non-agentic, n=1. It establishes the knob is
# REAL and observable -- which is all a smoke test should -- not what it does to an
# agent loop. That is exactly what this experiment measures.
experiment:
  name: experiment-49-versions-cloud
  visibility: public
factors:
  language: { levels: [python, go] }              # design pins python
  model:
    levels:
      - claude-opus-4-7
      - claude-opus-4-8
      - claude-opus-4-8-fast
      - claude-fable-5
      - claude-opus-5
  prompt: { levels: [neutral, none] }             # design pins neutral
  # THINKING LEVEL — new factor (user request, 2026-07-25). Every experiment to
  # date ran at the CLI default, so `default` is kept as an explicit level: it is
  # the historical baseline and is NOT equivalent to any named level (see below).
  effort: { levels: [default, low, medium, high, max] }
responses: [code_quality, token_efficiency, test_coverage, defect_rate, maintainability, idiomatic]
tasks:
  - source: bundled://rest-api-crud
playpen:
  runner: local
  replicates: 3
  timeout_minutes: 60
  stall_minutes: 25
  max_turns: 200
  prompts_dir: prompts
design: { screening_resolution: 3, significance_threshold: 0.10 }
promotion: { screening_to_trial: { p_value: 0.10 }, trial_to_production: { posterior_confidence: 0.80 } }
evaluation: { enabled: true, model: opus-4.8 }
