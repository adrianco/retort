[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "book-api"
version = "1.0.0"
description = "A small REST API for managing a book collection, backed by SQLite."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["Flask>=2.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
book-api = "book_api.__main__:main"

[tool.setuptools]
packages = ["book_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
