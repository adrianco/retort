experiment:
  name: codex-smoke
  visibility: private

# One cell is a harness integration check, not a statistical comparison.
factors:
  language:
    # Retort's design generator requires at least two language levels. The
    # checked-in design.csv selects just the Python cell for this smoke run.
    levels: [python, go]
  agent:
    # The alternate profile satisfies Retort's two-level factor rule; the
    # explicit smoke design uses only the pinned `codex` profile.
    levels: [codex, codex-default]
  framework:
    levels: [fastapi, stdlib]

responses:
  - code_quality
  - build_time
  - token_efficiency
  - test_coverage
  - defect_rate
  - maintainability

tasks:
  - source: bundled://rest-api-crud

playpen:
  runner: local
  replicates: 1
  timeout_minutes: 20
  stall_minutes: 5
  local_agents:
    codex:
      harness: codex
      # Pin this to the Codex model available to the authenticated CLI.
      model: gpt-5.6-terra
    codex-default:
      harness: codex

design:
  screening_resolution: 3
  significance_threshold: 0.10

evaluation:
  enabled: false
